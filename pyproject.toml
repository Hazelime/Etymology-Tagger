[project]
name = "etymology-tagger"
version = "0.1.0"
description = "Prototype English etymology tagger using Kaikki Wiktionary data and fastText vectors."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "gradio>=4.44",
  "huggingface_hub>=0.23"
]

[tool.setuptools.packages.find]
where = ["src"]
